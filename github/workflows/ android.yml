name: Application Android (APK)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Adresse du site en ligne
        shell: bash
        env:
          URL_SITE: ${{ vars.URL_SITE }}
        run: |
          URL="${URL_SITE:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/}"
          echo "Le site en ligne utilisé : $URL"
          echo "URL_SITE_FINALE=$URL" >> "$GITHUB_ENV"
      - name: Outils d'image
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Préparer l'enveloppe Capacitor
        working-directory: mobile
        run: |
          npm install
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.server.url=process.env.URL_SITE_FINALE;fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          rm -rf www && cp -r ../www www
          npx cap add android
          npx cap sync android
      - name: Icônes de l'application
        run: bash scripts/android-icons.sh
      - name: Construire l'APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renommer l'APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk EcoleNumerique-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EcoleNumerique-Android
          path: EcoleNumerique-Android.apk
      - name: Joindre à la Release (étiquette v…)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EcoleNumerique-Android.apk
